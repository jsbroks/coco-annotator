# NVIDIA GPU for Segment Anything, YOLO pre-annotation and training.
# Requires the NVIDIA Container Toolkit.
#   ./models/download_sam.sh
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  webserver:
    build:
      args:
        SAM: cuda
    environment:
      SAM_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  trainer:
    environment:
      # nvidia-smi in the container: whether the GPU is used outside this site
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
