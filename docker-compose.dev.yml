# Development: docker compose -f docker-compose.dev.yml up --build
#   http://localhost:8080  Vite dev server with hot reload (proxies the API)
#   http://localhost:5000  Flask API (auto-reloads on code changes)

x-backend-env: &backend-env
  PYTHONPATH: /workspace/backend
  SECRET_KEY: dev-secret
  MONGODB_HOST: mongodb://database/flask
  CELERY_BROKER_URL: amqp://user:password@messageq:5672//
  CELERY_RESULT_BACKEND: mongodb://database/flask

volumes:
  mongodb7_data:
  client_node_modules:

networks:
  cocoannotator:

services:
  frontend:
    container_name: annotator_client
    build:
      context: .
      dockerfile: ./client/Dockerfile
    ports:
      - "8080:8080"
    environment:
      BACKEND_URL: http://webserver:5000
    volumes:
      - "./client:/workspace/client"
      - "client_node_modules:/workspace/client/node_modules"
    networks:
      - cocoannotator
    depends_on:
      - webserver

  webserver:
    container_name: annotator_webserver
    build:
      context: .
      target: python-base
      args:
        SAM: ${SAM:-none}
    ports:
      - "5000:5000"
    working_dir: /workspace/backend
    command: gunicorn -c webserver/gunicorn_config.py webserver:app --no-sendfile --reload
    environment:
      <<: *backend-env
      FILE_WATCHER: "true"
      DEBUG: "true"
      SAM_CHECKPOINT: ${SAM_CHECKPOINT:-/models/sam2.1_b.pt}
    volumes:
      - "./backend:/workspace/backend"
      - "${DATASETS_DIR:-./datasets}:/datasets"
      - "${MODELS_DIR:-./models}:/models"
    networks:
      - cocoannotator
    depends_on:
      - database
      - workers

  workers:
    container_name: annotator_workers
    build:
      context: .
      target: python-base
    working_dir: /workspace/backend
    command: celery -A workers worker -l info
    environment:
      <<: *backend-env
    volumes:
      - "./backend:/workspace/backend"
      - "${DATASETS_DIR:-./datasets}:/datasets"
    depends_on:
      - messageq
      - database
    networks:
      - cocoannotator

  database:
    image: mongo:7.0
    container_name: annotator_mongodb
    volumes:
      - "mongodb7_data:/data/db"
    ports:
      - "27017:27017"
    networks:
      - cocoannotator

  messageq:
    image: rabbitmq:4.1-alpine
    container_name: annotator_message_q
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - cocoannotator
